# Render Blueprint for Mandat on NVIDIA Nemotron (Nebius × NVIDIA hackathon): the "mandat-nebius" service, branch nebius.
# Never the free "mandat" service of the PayPal demo: that one stays on main.
# Secrets marked "sync: false" are asked for once in the Render dashboard and are never stored in this repo.
# The public URL comes from Render (RENDER_EXTERNAL_URL); Web Push keys are generated at start.
# The free plan's disk is ephemeral: data/ is mirrored to Cloudflare R2 (lib/store.mjs) and restored at start.
services:
  - type: web
    name: mandat-nebius
    runtime: node
    plan: starter
    branch: nebius
    region: frankfurt
    buildCommand: npm ci
    startCommand: node start.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The models: NVIDIA Nemotron on Nebius Token Factory (OpenAI-compatible). These are also the defaults in code.
      - key: NEBIUS_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: LLM_FAST_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: LLM_SMART_MODEL
        value: nvidia/Nemotron-3-Ultra-550b-a55b
      - key: LLM_VISION_MODEL
        value: google/gemma-3-27b-it
      # Demo merchants without an AI agent answer in 8 to 20 s instead of 20 to 50 s.
      - key: MANDAT_MERCHANT_DELAY
        value: "0.4"
      # The model bill until judging ends (15 Dec): a hard ceiling (about 50 full missions at ~$0.20 each), then the
      # agent pauses with a clear message; and fair daily shares so one visitor cannot use it all.
      - key: MANDAT_LLM_BUDGET_USD
        value: "10"
      - key: MANDAT_MISSIONS_PER_USER_DAY
        value: "5"
      - key: MANDAT_TURNS_PER_USER_DAY
        value: "40"
      - key: MANDAT_TURNS_PER_DAY
        value: "300"
      - key: MANDAT_STUDIO_TURNS_PER_USER_DAY
        value: "20"
      - key: MANDAT_STUDIO_TURNS_PER_DAY
        value: "150"
      # Its own folder in the R2 bucket: never mixed with the PayPal demo's data.
      - key: R2_PREFIX
        value: nebius/
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      # Real products to shop for (Channel3: 100M+ products, 25k+ retailers).
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      # Durable data (accounts, missions, photos, push keys) in a Cloudflare R2 bucket named mandat-data.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@mandat.app
      - key: MANDAT_NETWORK_SECRET
        generateValue: true
