# Render Blueprint for the Mandat hackathon demo (free web service).
# Secrets marked "sync: false" are asked for once in the Render dashboard and are never stored in this repo.
# The public URL comes from Render (RENDER_EXTERNAL_URL); Web Push keys are generated at start.
# Note: the free plan's disk is ephemeral; data/ (users, missions, OSM cache) resets on every redeploy.
services:
  - type: web
    name: mandat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@mandat.app
      - key: MANDAT_NETWORK_SECRET
        generateValue: true
