# Render Blueprint for the Mandat hackathon demo (free web service).
# Secrets marked "sync: false" are asked for in the Render dashboard and are never stored in this repo.
# Note: the free plan's disk is ephemeral; data/ (users, missions, OSM cache) resets on every redeploy.
services:
  - type: web
    name: mandat
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@mandat.app
      - key: MANDAT_NETWORK_SECRET
        generateValue: true
